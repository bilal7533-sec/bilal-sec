name: Ansible CI

on:
  push:
    paths:
      - "projects/enterprise-ansible-platform/**"
  pull_request:
    paths:
      - "projects/enterprise-ansible-platform/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-ansible-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          ansible-galaxy collection install -r requirements.yml
      - name: Syntax checks
        run: |
          ansible-playbook -i inventory/hosts.ini playbooks/site.yml --syntax-check
          ansible-playbook -i inventory/hosts.ini playbooks/patch.yml --syntax-check
          ansible-playbook -i inventory/hosts.ini playbooks/hardening.yml --syntax-check
          ansible-playbook -i inventory/hosts.ini playbooks/verify.yml --syntax-check
      - name: Ansible lint
        run: ansible-lint playbooks roles
