---
- name: Install web server on Debian
  ansible.builtin.apt:
    name: "{{ web_package }}"
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Install web server on RHEL
  ansible.builtin.dnf:
    name: "{{ web_package }}"
    state: present
  when: ansible_os_family == 'RedHat'

- name: Deploy managed web landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_document_root[ansible_os_family] }}/index.html"
    owner: "{{ web_user }}"
    group: "{{ web_user }}"
    mode: '0644'
  notify: restart_web

- name: Enable web service
  ansible.builtin.service:
    name: "{{ web_service }}"
    enabled: true
    state: started
