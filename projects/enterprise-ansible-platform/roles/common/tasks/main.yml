---
- name: Install baseline packages on Debian
  ansible.builtin.apt:
    name: "{{ baseline_packages.Debian }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install baseline packages on RHEL
  ansible.builtin.dnf:
    name: "{{ baseline_packages.RedHat }}"
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install chrony
  ansible.builtin.package:
    name: chrony
    state: present

- name: Deploy standard MOTD
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: '0644'
