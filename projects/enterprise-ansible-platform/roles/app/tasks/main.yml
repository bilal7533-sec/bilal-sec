---
- name: Install application runtime on Debian
  ansible.builtin.apt:
    name: "{{ app_runtime_package }}"
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Install application runtime on RHEL
  ansible.builtin.dnf:
    name: "{{ app_runtime_package }}"
    state: present
  when: ansible_os_family == 'RedHat'

- name: Create application service account
  ansible.builtin.user:
    name: "{{ app_service_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_service_user }}"
    group: "{{ app_service_user }}"
    mode: '0750'
  loop:
    - /opt/enterprise-app
    - /etc/enterprise-app

- name: Deploy application environment
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/enterprise-app/app.env
    owner: root
    group: "{{ app_service_user }}"
    mode: '0640'
  notify: restart_app

- name: Deploy systemd unit
  ansible.builtin.template:
    src: enterprise-app.service.j2
    dest: /etc/systemd/system/enterprise-app.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - daemon_reload
    - restart_app

- name: Enable application service
  ansible.builtin.service:
    name: enterprise-app
    enabled: true
    state: started
