---
- name: Ensure SSH include directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy hardened SSH policy
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-enterprise-hardening.conf
    owner: root
    group: root
    mode: '0600'
    validate: "/usr/sbin/sshd -t -f %s"
  notify: restart_sshd
